<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rokesh R | Full Stack PHP Developer</title>
<meta name="description" content="Rokesh R, Full Stack PHP Developer with 3.5+ years of experience building web applications, RESTful APIs and digital evaluation platforms for educational institutions.">
<meta name="theme-color" content="#0b1020">
<script>
(function () {
  var ids = ["midnight", "ocean", "emerald", "royal", "sunset"];
  var metas = { midnight: "#0b1020", ocean: "#ffffff", emerald: "#ffffff", royal: "#0f0a1f", sunset: "#fffdf9" };
  var t = null;
  try { t = localStorage.getItem("rokesh-theme"); } catch (e) {}
  if (ids.indexOf(t) === -1) {
    t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "ocean" : "midnight";
  }
  document.documentElement.setAttribute("data-theme", t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", metas[t]);
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
